# Trooth Pre-Flight is retired. This file replaces the scanning action on main
# and on the v1 and v1.1 tags, so a workflow that still references it runs no
# compliance scanning, receives no score, posts no pull-request comment and
# interpolates none of its inputs into shell text. Inputs reach the one step
# only as environment variables, and nothing reads them except to decide
# whether the step fails.
#
# What a caller sees:
#   strict: "true"   the step fails, because the gate it asked for no longer exists
#   otherwise        the step passes with a warning, as the advisory action did
# Either way the annotation says what replaced it.
name: "Trooth Pre-Flight (retired)"
description: "Retired. Runs nothing and says what replaced it: troothllc/trooth-action, which reads what infrastructure declares and issues no verdict."
branding:
  icon: "x-circle"
  color: "gray-dark"
inputs:
  plan-json:
    description: "Ignored. Kept so existing workflows do not error on an unknown input."
    required: false
    default: ""
  strict:
    description: "If 'true', the step fails, because the gate it requested no longer exists."
    required: false
    default: "false"
  comment:
    description: "Ignored. The retired action no longer posts comments."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        PREFLIGHT_STRICT: ${{ inputs.strict }}
      run: |
        set -u
        MSG="Trooth Pre-Flight is retired and ran nothing. Trooth no longer checks infrastructure against SOC 2, ISO 27001 or the EU AI Act and issues no verdict. To read what your infrastructure declares, use troothllc/trooth-action pinned by commit: https://github.com/troothllc/trooth-action"
        {
          echo "## Trooth Pre-Flight (retired)"
          echo
          echo "$MSG"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$PREFLIGHT_STRICT" = "true" ]; then
          echo "::error title=Trooth Pre-Flight is retired::$MSG"
          exit 1
        fi
        echo "::warning title=Trooth Pre-Flight is retired::$MSG"
